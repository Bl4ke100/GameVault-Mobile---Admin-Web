<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault | Reports & Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        /* Print Styles for Report Engine */
        @media print {
            body * {
                visibility: hidden;
            }
            #printArea, #printArea * {
                visibility: visible;
            }
            #printArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white !important;
                color: black !important;
                padding: 1rem;
            }
            #printArea table th {
                background: #f3f4f6 !important;
                color: black !important;
                border: 1px solid #d1d5db !important;
            }
            #printArea table td {
                color: black !important;
                border: 1px solid #d1d5db !important;
            }
        }
    </style>
</head>

<body class="bg-[#0a0a0a] text-white flex h-screen font-sans hidden" id="bodyContent">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-[#1a1a1a] flex flex-col border-r border-[#1f1f1f] shrink-0">
        <div class="p-6 text-2xl font-bold text-white tracking-tighter">
            GAMEVAULT <span class="text-xs text-[#888]">ADMIN</span>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <a href="dashboard.html" class="flex items-center p-3 hover:bg-gray-700 rounded-lg text-[#888] hover:text-white transition"><i class="fas fa-home w-6"></i> Dashboard</a>
            <a href="games.html" class="flex items-center p-3 hover:bg-gray-700 rounded-lg text-[#888] hover:text-white transition"><i class="fas fa-gamepad w-6"></i> Games</a>
            <a href="users.html" class="flex items-center p-3 hover:bg-gray-700 rounded-lg text-[#888] hover:text-white transition"><i class="fas fa-users w-6"></i> Users</a>
            <a href="orders.html" class="flex items-center p-3 hover:bg-gray-700 rounded-lg text-[#888] hover:text-white transition"><i class="fas fa-shopping-cart w-6"></i> Orders</a>
            <a href="reports.html" class="flex items-center p-3 bg-white text-black hover:bg-gray-200 border-white text-xs text-center rounded-lg shadow-lg font-bold"><i class="fas fa-chart-bar w-6"></i> Reports & Comms</a>
            <a href="banners.html" class="flex items-center p-3 hover:bg-gray-700 rounded-lg text-[#888] hover:text-white transition"><i class="fas fa-images w-6"></i> Banners Hub</a>
        </nav>
        <div class="p-4 border-t border-[#1f1f1f]">
            <button id="btnLogout" class="w-full text-left p-3 text-red-400 hover:bg-red-500/10 rounded-lg transition"><i class="fas fa-sign-out-alt w-6"></i> Logout</button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col overflow-hidden relative">
        <header class="h-16 bg-[#1a1a1a] border-b border-[#1f1f1f] flex items-center justify-between px-8 shrink-0">
            <h2 class="text-xl font-semibold tracking-wide">Reporting & Notifications</h2>
        </header>

        <section class="p-8 overflow-y-auto flex-1 flex flex-col xl:flex-row gap-8">
            
            <!-- LEFT COLUMN: Firebase Push Notification Sender -->
            <div class="xl:w-1/3 flex flex-col gap-6">
                <div class="bg-[#1a1a1a] rounded-xl border border-[#1f1f1f] shadow-xl overflow-hidden">
                    <div class="bg-gradient-to-r from-purple-600 to-blue-600 p-6 flex items-center justify-between">
                        <div>
                            <h3 class="text-xl font-bold text-white shadow-sm">Push Notifications</h3>
                            <p class="text-xs text-purple-100 mt-1 opacity-90"><i class="fas fa-satellite-dish mr-1"></i> Firebase Cloud Messaging</p>
                        </div>
                        <i class="fas fa-paper-plane text-4xl text-white opacity-20"></i>
                    </div>
                    
                    <form id="fcmForm" class="p-6 space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-[#888] uppercase tracking-wider mb-2">Notification Title</label>
                            <input type="text" id="pushTitle" placeholder="e.g. Flash Sale! 🎮" required class="w-full bg-[#0a0a0a] border border-[#1f1f1f] rounded-lg px-4 py-3 focus:border-purple-500 text-white shadow-sm outline-none">
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-[#888] uppercase tracking-wider mb-2">Notification Body</label>
                            <textarea id="pushBody" rows="3" placeholder="Write your message here..." required class="w-full bg-[#0a0a0a] border border-[#1f1f1f] rounded-lg px-4 py-3 focus:border-purple-500 text-white shadow-sm outline-none resize-none"></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-[#888] uppercase tracking-wider mb-2">Target Audience</label>
                            <select id="pushTarget" class="w-full bg-[#0a0a0a] border border-[#1f1f1f] rounded-lg px-4 py-3 focus:border-purple-500 text-white shadow-sm outline-none">
                                <option value="all">Broadcast to All Users</option>
                                <option value="testers">Internal Admins Only</option>
                            </select>
                            <p class="text-[10px] text-[#555] mt-2 font-mono"><i class="fas fa-info-circle mr-1"></i>Saves to 'broadcasts' Firestore collection.</p>
                        </div>

                        <button type="submit" id="btnSendPush" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg hover:shadow-purple-500/20 transition flex justify-center items-center">
                            <i class="fas fa-rocket mr-2"></i> Deploy Notification
                        </button>
                        
                        <div id="pushStatus" class="text-xs text-center hidden font-bold mt-2"></div>
                    </form>
                </div>
            </div>

            <!-- RIGHT COLUMN: Report Generator Engine -->
            <div class="xl:w-2/3 flex flex-col">
                <div class="bg-[#1a1a1a] rounded-xl border border-[#1f1f1f] shadow-xl p-6 flex-1 flex flex-col">
                    <h3 class="text-xl font-bold text-white mb-6 border-b border-[#1f1f1f] pb-4"><i class="fas fa-file-invoice mr-2 text-emerald-500"></i>Report Engine</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div>
                            <label class="block text-xs font-bold text-[#888] uppercase tracking-wider mb-2">Report Type</label>
                            <select id="reportType" class="w-full bg-[#0a0a0a] border border-[#2a2a2a] rounded-lg px-4 py-2 text-white outline-none">
                                <option value="sales">Sales & Revenue</option>
                                <option value="inventory">Games Inventory</option>
                                <option value="users">Registered Users</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-[#888] uppercase tracking-wider mb-2">Time Filter</label>
                            <select id="reportTime" class="w-full bg-[#0a0a0a] border border-[#2a2a2a] rounded-lg px-4 py-2 text-white outline-none">
                                <option value="all">All Time</option>
                                <option value="30">Last 30 Days</option>
                                <option value="7">Last 7 Days</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button id="btnGenerateReport" class="w-full bg-white text-black hover:bg-gray-200 font-bold py-2 px-4 rounded-lg transition shadow-md">
                                <i class="fas fa-cogs mr-2"></i> Generate
                            </button>
                        </div>
                    </div>

                    <!-- Print Container (What actually gets exported) -->
                    <div id="printArea" class="bg-[#0a0a0a] rounded-lg border border-[#1f1f1f] flex-1 overflow-hidden flex flex-col relative hidden">
                        <div class="absolute top-4 right-4 z-10 hidden print-hide" id="exportControls">
                            <button id="btnPrint" class="bg-gray-700 hover:bg-[#2a2a2a] text-white px-4 py-2 rounded text-sm font-bold shadow-lg transition border border-[#2a2a2a]">
                                <i class="fas fa-print mr-2"></i> Print / PDF
                            </button>
                        </div>
                        
                        <div class="p-8 overflow-y-auto w-full h-full">    
                            <!-- Header Generated Dynamically -->
                            <div id="reportHeader" class="mb-8 border-b border-[#1f1f1f] pb-4">
                                <h1 class="text-2xl font-black text-white" id="rTitle">Report Title</h1>
                                <p class="text-sm text-[#888] font-mono mt-1" id="rTimestamp">Generated At: ...</p>
                            </div>
                            
                            <!-- Key Metrics Inserted Here -->
                            <div id="reportMetrics" class="flex gap-8 mb-8"></div>
                            
                            <!-- Actual Data Table -->
                            <table class="w-full text-left border-collapse text-sm">
                                <thead id="reportTableHead" class="bg-[#1a1a1a] text-[#888] border-b border-[#1f1f1f]"></thead>
                                <tbody id="reportTableBody" class="divide-y divide-gray-700/50 text-[#ccc]"></tbody>
                            </table>
                        </div>
                    </div>

                    <div id="emptyReportState" class="flex-1 flex flex-col items-center justify-center text-[#555] border border-dashed border-[#1f1f1f] rounded-lg bg-[#0a0a0a]/50">
                        <i class="fas fa-file-alt text-4xl mb-3 opacity-50"></i>
                        <p class="font-bold tracking-widest uppercase text-xs">Awaiting Generation</p>
                    </div>

                </div>
            </div>

        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDfgmqKJHdj3udZiK9ubTuJWGqj9JWIYPI",
            authDomain: "gamevault-ffe65.firebaseapp.com",
            projectId: "gamevault-ffe65",
            storageBucket: "gamevault-ffe65.firebasestorage.app",
            messagingSenderId: "152244395979",
            appId: "1:152244395979:web:f81081c09c6d9aa41b204e",
            measurementId: "G-KXPXH90XKF"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (user) document.getElementById('bodyContent').classList.remove('hidden');
            else window.location.href = "index.html";
        });
        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth).then(() => window.location.href = "index.html"));

        /* =========================================
           1. NOTIFICATION SENDER ENGINE
        ========================================= */
        document.getElementById('fcmForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSendPush');
            const status = document.getElementById('pushStatus');
            const title = document.getElementById('pushTitle').value;
            const body = document.getElementById('pushBody').value;
            const target = document.getElementById('pushTarget').value;

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Broadcasting...`;
            
            try {
                // We save this Broadcast request entirely into Firestore.
                // A configured Firebase Cloud Function on the backend should listen to 'broadcasts'
                await addDoc(collection(db, "broadcasts"), {
                    title: title,
                    body: body,
                    targetAudience: target,
                    status: "QUEUED",
                    createdAt: serverTimestamp()
                });

                status.innerText = "Notification successfully queued to Firebase!";
                status.className = "text-xs text-center font-bold mt-2 text-emerald-400";
                status.classList.remove('hidden');
                document.getElementById('fcmForm').reset();
            } catch (err) {
                console.error("Broadcast failed:", err);
                status.innerText = "Error queuing notification. Check logs.";
                status.className = "text-xs text-center font-bold mt-2 text-red-400";
                status.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-rocket mr-2"></i> Deploy Notification`;
                setTimeout(() => status.classList.add('hidden'), 4000);
            }
        });

        /* =========================================
           2. REPORT GENERATION ENGINE
        ========================================= */
        document.getElementById('btnGenerateReport').addEventListener('click', async () => {
            const btn = document.getElementById('btnGenerateReport');
            const rType = document.getElementById('reportType').value;
            const rTime = document.getElementById('reportTime').value; // 'all', '30', '7'
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            const printArea = document.getElementById('printArea');
            const emptyState = document.getElementById('emptyReportState');
            const tHead = document.getElementById('reportTableHead');
            const tBody = document.getElementById('reportTableBody');
            const rMetrics = document.getElementById('reportMetrics');

            // Reset UI
            emptyState.classList.add('hidden');
            printArea.classList.remove('hidden');
            document.getElementById('exportControls').classList.remove('hidden');
            document.getElementById('exportControls').classList.remove('print-hide'); // Actually keep it hidden in native CSS
            tHead.innerHTML = '';
            tBody.innerHTML = '';
            rMetrics.innerHTML = '';

            // Calc cut-off Date
            let cutoffEpoch = 0;
            if (rTime !== 'all') {
                const now = new Date();
                now.setDate(now.getDate() - parseInt(rTime));
                cutoffEpoch = now.getTime();
            }

            try {
                if (rType === 'sales') {
                    // FETCH ORDERS
                    document.getElementById('rTitle').innerText = `Sales & Revenue Report (${rTime === 'all' ? 'All Time' : 'Last ' + rTime + ' Days'})`;
                    document.getElementById('rTimestamp').innerText = new Date().toLocaleString();
                    
                    const ordersSnap = await getDocs(collection(db, "orders"));
                    
                    let filteredOrders = [];
                    let grossRevenue = 0;
                    let successCount = 0;

                    ordersSnap.forEach(d => {
                        const o = d.data();
                        if (o.orderDate >= cutoffEpoch) {
                            filteredOrders.push(o);
                            const st = (o.status||'').toUpperCase();
                            if (['COMPLETED', 'DELIVERED', 'PAID'].includes(st)) {
                                grossRevenue += (o.totalAmount || 0);
                                successCount++;
                            }
                        }
                    });

                    filteredOrders.sort((a,b) => (b.orderDate||0) - (a.orderDate||0));

                    // Metrics
                    rMetrics.innerHTML = `
                        <div>
                            <p class="text-[10px] text-[#555] uppercase font-bold tracking-wider">Gross Rev.</p>
                            <p class="text-2xl font-bold text-emerald-400">Rs ${grossRevenue.toLocaleString()}</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-[#555] uppercase font-bold tracking-wider">Successful Orders</p>
                            <p class="text-2xl font-bold text-white">${successCount}</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-[#555] uppercase font-bold tracking-wider">Total Transactions</p>
                            <p class="text-2xl font-bold text-white">${filteredOrders.length}</p>
                        </div>
                    `;

                    // Table
                    tHead.innerHTML = `<tr><th class="p-3">Date</th><th class="p-3">Order ID</th><th class="p-3">Customer</th><th class="p-3">Status</th><th class="p-3 text-right">Amount</th></tr>`;
                    if(filteredOrders.length===0) tBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center">No records.</td></tr>`;
                    filteredOrders.forEach(o => {
                        const dt = new Date(o.orderDate || 0).toLocaleDateString();
                        const id = (o.orderId || 'N/A').substring(0,8);
                        const cst = o.billingAddress?.fullName || 'Anonymous';
                        const st = (o.status||'').toUpperCase();
                        const amt = (o.totalAmount||0).toLocaleString(undefined, {minimumFractionDigits:2});
                        tBody.innerHTML += `<tr><td class="p-3">${dt}</td><td class="p-3 font-mono text-xs">${id}</td><td class="p-3">${cst}</td><td class="p-3 text-[10px]">${st}</td><td class="p-3 text-right font-bold tracking-wide">Rs ${amt}</td></tr>`;
                    });

                } else if (rType === 'inventory') {
                    // FETCH GAMES
                    document.getElementById('rTitle').innerText = "Store Inventory Status";
                    document.getElementById('rTimestamp').innerText = new Date().toLocaleString();
                    
                    const gamesSnap = await getDocs(collection(db, "games"));
                    let totalStock = 0;
                    let count = 0;
                    let rows = [];

                    gamesSnap.forEach(d => {
                        const g = d.data();
                        totalStock += (g.stock || 0);
                        count++;
                        rows.push(`<tr><td class="p-3 font-bold text-white">${g.title||''}</td><td class="p-3">${g.category||''}</td><td class="p-3">${g.platforms?g.platforms.join(','):''}</td><td class="p-3 text-right text-[#fff] font-bold font-bold">${g.stock||0}</td><td class="p-3 text-right">Rs ${(g.price||0).toLocaleString()}</td></tr>`);
                    });

                    rMetrics.innerHTML = `
                        <div><p class="text-[10px] text-[#555] uppercase font-bold tracking-wider">Total Unique Titles</p><p class="text-2xl font-bold text-[#fff] font-bold">${count}</p></div>
                        <div><p class="text-[10px] text-[#555] uppercase font-bold tracking-wider">Sum of Stock Across Store</p><p class="text-2xl font-bold text-white">${totalStock} Units</p></div>
                    `;
                    
                    tHead.innerHTML = `<tr><th class="p-3">Title</th><th class="p-3">Category</th><th class="p-3">Platforms</th><th class="p-3 text-right">Stock Level</th><th class="p-3 text-right">Unit Price</th></tr>`;
                    tBody.innerHTML = rows.join('');

                } else if (rType === 'users') {
                    // FETCH USERS
                    document.getElementById('rTitle').innerText = `Registered Users Demographics (${rTime === 'all' ? 'All Time' : 'Last ' + rTime + ' Days'})`;
                    document.getElementById('rTimestamp').innerText = new Date().toLocaleString();
                    
                    const usersSnap = await getDocs(collection(db, "users"));
                    // In a highly flushed version, creation epoch would be checked here. 
                    // Assuming all users for now if no creation data exists on schema.
                    
                    let rows = [];
                    usersSnap.forEach(d => {
                        const u = d.data();
                        const addr = [u.addressLine1, u.city].filter(x=>x).join(', ') || 'N/A';
                        rows.push(`<tr><td class="p-3 font-bold text-white">${u.username||'N/A'}</td><td class="p-3">${u.email||''}</td><td class="p-3">${u.phone||'N/A'}</td><td class="p-3 text-xs w-1/3 truncate">${addr}</td></tr>`);
                    });

                    rMetrics.innerHTML = `
                        <div><p class="text-[10px] text-[#555] uppercase font-bold tracking-wider">Total Audited Users</p><p class="text-2xl font-bold text-purple-400">${rows.length}</p></div>
                    `;

                    tHead.innerHTML = `<tr><th class="p-3">Username</th><th class="p-3">Email Address</th><th class="p-3">Phone</th><th class="p-3">Location Context</th></tr>`;
                    tBody.innerHTML = rows.join('');
                }

            } catch (error) {
                console.error("Report Generation Failed:", error);
                tBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500 font-bold">Failed to pull database.</td></tr>`;
            } finally {
                btn.innerHTML = '<i class="fas fa-cogs mr-2"></i> Generate';
                btn.disabled = false;
            }
        });

        // Add a print hide CSS class rule inline at runtime for the exportControls button
        const style = document.createElement('style');
        style.innerHTML = `@media print { .print-hide { display: none !important; } }`;
        document.head.appendChild(style);

        document.getElementById('btnPrint').addEventListener('click', () => {
            window.print();
        });

    </script>
</body>
</html>
