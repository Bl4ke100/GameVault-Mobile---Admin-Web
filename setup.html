<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault | Admin Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white flex items-center justify-center h-screen font-sans">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-500 tracking-tighter">GAMEVAULT</h1>
            <p class="text-yellow-400 text-sm mt-2 font-bold">⚠️ ONE-TIME ADMIN SETUP ⚠️</p>
        </div>

        <form id="signupForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Your Name</label>
                <input type="text" id="name" value="Blake" required
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 text-white">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Admin Email</label>
                <input type="email" id="email" required
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 text-white">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Password</label>
                <input type="password" id="password" required minlength="6"
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 text-white">
            </div>

            <button type="submit" id="signupBtn"
                class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition duration-200 mt-4">
                Create Admin Account
            </button>
        </form>

        <div id="message" class="mt-4 text-sm text-center hidden py-2 rounded"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. PASTE YOUR CONFIG HERE
        const firebaseConfig = {
            apiKey: "AIzaSyDfgmqKJHdj3udZiK9ubTuJWGqj9JWIYPI",
            authDomain: "gamevault-ffe65.firebaseapp.com",
            projectId: "gamevault-ffe65",
            storageBucket: "gamevault-ffe65.firebasestorage.app",
            messagingSenderId: "152244395979",
            appId: "1:152244395979:web:f81081c09c6d9aa41b204e",
            measurementId: "G-KXPXH90XKF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const form = document.getElementById('signupForm');
        const msgDiv = document.getElementById('message');
        const btn = document.getElementById('signupBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msgDiv.classList.add('hidden');
            btn.textContent = "Creating...";
            btn.disabled = true;

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // 2. Create the user in Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 3. Automatically add them to the 'admins' Firestore collection!
                await setDoc(doc(db, "admins", user.uid), {
                    name: name,
                    email: email,
                    role: "admin",
                    createdAt: new Date()
                });

                msgDiv.textContent = "Success! Redirecting to login...";
                msgDiv.className = "mt-4 text-sm text-center py-2 rounded bg-green-500/10 text-green-400";

                // Send you to the login page after 2 seconds
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);

            } catch (error) {
                msgDiv.textContent = "Error: " + error.message;
                msgDiv.className = "mt-4 text-sm text-center py-2 rounded bg-red-500/10 text-red-400";
            } finally {
                btn.textContent = "Create Admin Account";
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
