<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault | Manage Banners</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .image-card:hover .delete-overlay {
            opacity: 1;
        }
        
        .upload-zone {
            transition: all 0.3s ease;
        }
        .upload-zone:hover {
            border-color: #3b82f6;
            background-color: rgba(59, 130, 246, 0.05);
        }
    </style>
</head>

<body class="bg-[#0a0a0a] text-white flex h-screen font-sans hidden" id="bodyContent">


    <main class="flex-1 flex flex-col overflow-hidden relative">
        <div id="header-container"></div>
        <div id="header-actions" class="hidden">
            <div id="globalStatus" class="text-[10px] font-bold text-[#888] uppercase tracking-wider flex items-center bg-[#1a1a1a] px-3 py-1 rounded border border-[#1f1f1f] hidden">
                <i class="fas fa-spinner fa-spin mr-2"></i>Synchronizing Cloud Assets...
            </div>
        </div>


        <section class="p-8 overflow-y-auto flex-1 space-y-12">
            
            <div>
                <div class="flex items-center justify-between mb-6 border-b border-[#1f1f1f] pb-4">
                    <div>
                        <h3 class="text-xl font-bold text-white"><i class="fas fa-star text-yellow-400 mr-2"></i>Primary Marketing Banners</h3>
                        <p class="text-sm text-[#888] mt-1">These span the main header slider of the Android application's Home tab.</p>
                    </div>
                    <label class="cursor-pointer bg-white text-black hover:bg-gray-200 font-bold py-2 px-4 rounded-lg shadow-lg transition flex items-center">
                        <i class="fas fa-cloud-upload-alt mr-2"></i> Upload Assets
                        <input type="file" id="uploadTopBanners" class="hidden" multiple accept="image/*">
                    </label>
                </div>
                
                <div id="topBannersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <div class="col-span-full h-32 flex items-center justify-center text-[#555] italic"><i class="fas fa-compact-disc fa-spin mr-2"></i> Fetching assets from cloud...</div>
                </div>
            </div>

            <div class="pt-6">
                <div class="flex items-center justify-between mb-6 border-b border-[#1f1f1f] pb-4">
                    <div>
                        <h3 class="text-xl font-bold text-white"><i class="fas fa-fire text-red-500 mr-2"></i>New Arrivals Carousel</h3>
                        <p class="text-sm text-[#888] mt-1">Displayed below the category grids to highlight seasonal game additions.</p>
                    </div>
                    <label class="cursor-pointer bg-[#ff3333] hover:bg-[#cc0000] hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg shadow-lg transition flex items-center">
                        <i class="fas fa-cloud-upload-alt mr-2"></i> Upload Assets
                        <input type="file" id="uploadNewArrivals" class="hidden" multiple accept="image/*">
                    </label>
                </div>
                
                <div id="newArrivalsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                </div>
            </div>

        </section>
    </main>

    <div id="previewModal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center backdrop-blur-sm transition-opacity p-4">
        <button id="closePreviewBtn" class="absolute top-6 right-6 text-[#888] hover:text-white"><i class="fas fa-times text-4xl"></i></button>
        <img id="previewImage" src="" class="max-w-full max-h-full rounded shadow-2xl border border-[#1f1f1f] object-contain">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getStorage, ref, listAll, getDownloadURL, deleteObject, uploadBytes } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDfgmqKJHdj3udZiK9ubTuJWGqj9JWIYPI",
            authDomain: "gamevault-ffe65.firebaseapp.com",
            projectId: "gamevault-ffe65",
            storageBucket: "gamevault-ffe65.firebasestorage.app",
            messagingSenderId: "152244395979",
            appId: "1:152244395979:web:f81081c09c6d9aa41b204e",
            measurementId: "G-KXPXH90XKF"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const storage = getStorage(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('bodyContent').classList.remove('hidden');
                refreshBothFolders();
            } else {
                window.location.href = "index.html";
            }
        });

        window.firebaseLogout = () => {
            signOut(auth).then(() => window.location.href = "index.html");
        };

        const statusLabel = document.getElementById('globalStatus');

        async function refreshBothFolders() {
            statusLabel.classList.remove('hidden');
            statusLabel.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Synchronizing Storage...';
            
            await Promise.all([
                loadFolder('images/banners', 'topBannersGrid'),
                loadFolder('images/new-arrivals', 'newArrivalsGrid')
            ]);
            
            statusLabel.classList.add('hidden');
        }

        async function loadFolder(folderPath, gridElementId) {
            const grid = document.getElementById(gridElementId);
            try {
                const folderRef = ref(storage, folderPath);
                const result = await listAll(folderRef);
                
                grid.innerHTML = ''; 

                if(result.items.length === 0) {
                    grid.innerHTML = `<div class="col-span-full bg-[#1a1a1a]/50 border border-dashed border-[#1f1f1f] rounded-lg p-8 flex flex-col items-center justify-center text-[#555]">
                        <i class="fas fa-images text-4xl mb-3 opacity-30"></i>
                        <p class="font-bold tracking-widest uppercase text-[10px]">Folder Empty</p>
                    </div>`;
                    return;
                }

                for (const itemRef of result.items) {
                    const url = await getDownloadURL(itemRef);
                    const name = itemRef.name;

                    const card = document.createElement('div');
                    card.className = "image-card relative group bg-[#1a1a1a] rounded-xl border border-[#1f1f1f] shadow-md overflow-hidden aspect-video transition-transform hover:scale-105 duration-300";
                    card.innerHTML = `
                        <img src="${url}" class="w-full h-full object-cover cursor-pointer" alt="${name}" onclick="openPreview('${url}')">
                        <div class="delete-overlay absolute top-0 right-0 p-3 opacity-0 transition-opacity duration-300 bg-gradient-to-bl from-black/80 to-transparent rounded-bl-xl">
                            <button class="bg-red-500/80 hover:bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg transition transform hover:scale-110" title="Delete Asset" onclick="deleteAsset('${folderPath}', '${name}')">
                                <i class="fas fa-trash-alt text-sm"></i>
                            </button>
                        </div>
                        <div class="absolute bottom-0 left-0 right-0 bg-black/60 p-2 text-[9px] font-mono text-[#ccc] truncate">
                            ${name}
                        </div>
                    `;
                    grid.appendChild(card);
                }
            } catch (error) {
                console.error("Error loading folder: ", folderPath, error);
                grid.innerHTML = `<div class="col-span-full text-center text-red-500 font-bold p-8 border border-red-500/20 rounded-xl bg-red-500/5">Failed to load payload from Cloud Storage. Check DevTools.</div>`;
            }
        }

        document.getElementById('uploadTopBanners').addEventListener('change', async (e) => {
            const files = e.target.files;
            if(files.length > 0) await handleUploads(files, 'images/banners');
            e.target.value = '';
        });

        document.getElementById('uploadNewArrivals').addEventListener('change', async (e) => {
            const files = e.target.files;
            if(files.length > 0) await handleUploads(files, 'images/new-arrivals');
            e.target.value = '';
        });

        async function handleUploads(files, _folderPath) {
            statusLabel.classList.remove('hidden');
            let success = 0;
            
            for(let i=0; i<files.length; i++) {
                const file = files[i];
                statusLabel.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Uploading ${i+1}/${files.length}...`;
                
                const safeName = Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9.]/g, '_');
                const fileRef = ref(storage, `${_folderPath}/${safeName}`);
                
                try {
                    await uploadBytes(fileRef, file);
                    success++;
                } catch(e) {
                    console.error("Upload failed for ", file.name, e);
                    alert("Failed to upload: " + file.name);
                }
            }

            statusLabel.innerHTML = `<i class="fas fa-check text-emerald-400 mr-2"></i> Uploaded ${success} Assets`;
            setTimeout(() => { refreshBothFolders(); }, 1500);
        }

        window.deleteAsset = async function(folderPath, fileName) {
            if(!confirm(`Delete visual asset "${fileName}" from the mobile app?`)) return;
            
            statusLabel.classList.remove('hidden');
            statusLabel.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Erasing object...`;

            try {
                const assetRef = ref(storage, `${folderPath}/${fileName}`);
                await deleteObject(assetRef);
                refreshBothFolders();
            } catch (error) {
                console.error("Deletion failed:", error);
                alert("Failed to securely delete asset.");
                statusLabel.classList.add('hidden');
            }
        };

        const previewModal = document.getElementById('previewModal');
        const previewImage = document.getElementById('previewImage');
        
        window.openPreview = function(url) {
            previewImage.src = url;
            previewModal.classList.remove('hidden');
        };

        document.getElementById('closePreviewBtn').addEventListener('click', () => {
            previewModal.classList.add('hidden');
        });
        
        previewModal.addEventListener('click', (e) => {
            if(e.target === previewModal) previewModal.classList.add('hidden');
        });

    </script>
    <script src="components.js"></script>
</body>
</html>
