<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault Admin | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .input-field {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #1f1f1f;
            border-radius: 10px;
            padding: 12px 16px;
            color: white;
            font-size: 14px;
            transition: border-color 0.2s;
            outline: none;
        }

        .input-field:focus {
            border-color: #ffffff;
        }

        .input-field::placeholder {
            color: #444;
        }

        .btn-login {
            width: 100%;
            background: #ffffff;
            color: #000000;
            font-weight: 800;
            font-size: 14px;
            padding: 13px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: opacity 0.2s, transform 0.15s;
        }

        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-login:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Subtle grid background */
        .bg-grid {
            background-color: #000000;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>

<body class="bg-grid text-white flex items-center justify-center h-screen">

    <div class="w-full max-w-sm px-4">

        <!-- Logo -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black tracking-tighter text-white">GAME<span
                    class="text-white opacity-30">VAULT</span></h1>
            <p class="text-[#444] text-xs mt-2 tracking-widest uppercase">Administrative Console</p>
        </div>

        <!-- Card -->
        <div class="bg-[#0d0d0d] border border-[#1f1f1f] rounded-2xl p-8 shadow-2xl">

            <!-- Card Header -->
            <div class="mb-7">
                <h2 class="text-lg font-bold text-white">Sign In</h2>
                <p class="text-[#555] text-xs mt-1">Enter your credentials to access the console</p>
            </div>

            <!-- Form -->
            <form id="loginForm" class="space-y-4">

                <!-- Email -->
                <div>
                    <label class="block text-[10px] font-bold text-[#555] uppercase tracking-widest mb-2">Email
                        Address</label>
                    <input type="email" id="email" required placeholder="admin@gamevault.com" class="input-field" />
                </div>

                <!-- Password -->
                <div>
                    <label
                        class="block text-[10px] font-bold text-[#555] uppercase tracking-widest mb-2">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" class="input-field" />
                </div>

                <!-- Error Message -->
                <div id="errorMessage"
                    class="hidden text-red-400 text-xs bg-red-500/10 border border-red-500/20 px-4 py-3 rounded-lg">
                </div>

                <!-- Submit -->
                <div class="pt-2">
                    <button type="submit" id="loginBtn" class="btn-login">
                        Sign In
                    </button>
                </div>

            </form>

        </div>

        <!-- Footer -->
        <p class="text-center text-[#333] text-[10px] mt-6 tracking-widest uppercase">
            © 2025 GameVault. All rights reserved.
        </p>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDfgmqKJHdj3udZiK9ubTuJWGqj9JWIYPI",
            authDomain: "gamevault-ffe65.firebaseapp.com",
            projectId: "gamevault-ffe65",
            storageBucket: "gamevault-ffe65.firebasestorage.app",
            messagingSenderId: "152244395979",
            appId: "1:152244395979:web:f81081c09c6d9aa41b204e",
            measurementId: "G-KXPXH90XKF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById('loginForm');
        const errorDiv = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');
            loginBtn.textContent = "Authenticating...";
            loginBtn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const adminDoc = await getDoc(doc(db, "admins", user.uid));

                if (adminDoc.exists()) {
                    window.location.replace("dashboard.html");
                } else {
                    await signOut(auth);
                    throw new Error("Access Denied: You do not have admin privileges.");
                }
            } catch (error) {
                let msg = error.message;
                if (error.code === 'auth/invalid-credential') msg = "Incorrect email or password.";
                errorDiv.textContent = msg;
                errorDiv.classList.remove('hidden');
            } finally {
                loginBtn.textContent = "Sign In";
                loginBtn.disabled = false;
            }
        });
    </script>

</body>

</html>
