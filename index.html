<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault Admin | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white flex items-center justify-center h-screen font-sans">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-500 tracking-tighter">GAMEVAULT</h1>
            <p class="text-gray-400 text-sm mt-2">Administrative Console Access</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Email Address</label>
                <input type="email" id="email" required
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 transition text-white">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Password</label>
                <input type="password" id="password" required
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 transition text-white">
            </div>

            <button type="submit" id="loginBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200 transform hover:scale-[1.02]">
                Sign In
            </button>
        </form>

        <div id="errorMessage" class="mt-4 text-red-500 text-sm text-center hidden bg-red-500/10 py-2 rounded"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDfgmqKJHdj3udZiK9ubTuJWGqj9JWIYPI",
            authDomain: "gamevault-ffe65.firebaseapp.com",
            projectId: "gamevault-ffe65",
            storageBucket: "gamevault-ffe65.firebasestorage.app",
            messagingSenderId: "152244395979",
            appId: "1:152244395979:web:f81081c09c6d9aa41b204e",
            measurementId: "G-KXPXH90XKF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById('loginForm');
        const errorDiv = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');
            loginBtn.textContent = "Authenticating...";
            loginBtn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // 1. Try Auth
                console.log("Attempting Firebase Auth...");
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                console.log("Auth Success! UID:", user.uid);

                // 2. Check Admin Collection
                console.log("Checking Firestore for Admin document...");
                const adminDoc = await getDoc(doc(db, "admins", user.uid));

                if (adminDoc.exists()) {
                    console.log("Admin verified. Redirecting now...");
                    // Force redirect using replace
                    window.location.replace("dashboard.html");
                } else {
                    console.log("User is not in the admins collection.");
                    await signOut(auth);
                    throw new Error("Access Denied: You do not have admin privileges.");
                }
            } catch (error) {
                console.error("Login Error:", error); // This will print the exact technical error
                let msg = error.message;
                if (error.code === 'auth/invalid-credential') msg = "Incorrect email or password.";

                errorDiv.textContent = msg;
                errorDiv.classList.remove('hidden');
            } finally {
                loginBtn.textContent = "Sign In";
                loginBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
